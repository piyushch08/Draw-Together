<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0f7b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f89b29;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0f7b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-glare" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Main container -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#grad1)" stroke="#ffffff" stroke-width="2" />
  
  <!-- Glare effect -->
